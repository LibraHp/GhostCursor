name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本标签，例如 v0.3.0；仅构建时无需先建标签，发布时标签必须已存在'
        required: true
        type: string
      publish:
        description: '构建成功后发布 GitHub Release；关闭时仅保留 Actions artifacts'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && github.ref || inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify version and architecture
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${pkg.version}` || !/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_TAG)) throw Error('Tag must match package.json version');
          if (process.arch !== process.env.EXPECTED_ARCH) throw Error('Runner architecture does not match release target');
          JS
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Install Electron runtime explicitly
        run: node node_modules/electron/install.js
      - name: Build app and native helper
        run: npm run build
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npx --no-install electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package macOS
        if: runner.os == 'macOS'
        run: npx --no-install electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: GhostCursor-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: GhostCursor-*
          path: release
          merge-multiple: true
      - name: Check complete release and generate checksums
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { existsSync } from 'node:fs';
          const version = process.env.RELEASE_TAG.slice(1);
          const files = [`GhostCursor-${version}-windows-x64-nsis.exe`, `GhostCursor-${version}-windows-x64-portable.exe`, ...['x64', 'arm64'].flatMap(arch => ['dmg', 'zip'].map(ext => `GhostCursor-${version}-macos-${arch}.${ext}`))];
          for (const file of files) if (!existsSync(`release/${file}`)) throw Error(`Missing release file: ${file}`);
          JS
          node scripts/checksums.mjs
      - name: Create draft, upload all assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/ghostcursor-release-state; then
            test "$(cat /tmp/ghostcursor-release-state)" = true || { echo 'Release is already public; refusing to replace assets'; exit 1; }
          else
            if test -f "docs/releases/$RELEASE_TAG.md"; then
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "GhostCursor $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
            else
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "GhostCursor $RELEASE_TAG" --generate-notes
            fi
          fi
          gh release upload "$RELEASE_TAG" release/*.exe release/*.dmg release/*.zip release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
