name: Build Web service
on:
  push:
    branches: [main, feat/web-service]
    paths: ['src/**', 'scripts/build-web.mjs', 'package*.json', 'vite.config.ts', 'tsconfig.json', 'Dockerfile', 'docs/web-service.md', '.github/workflows/web.yml']
  pull_request:
    paths: ['src/**', 'scripts/build-web.mjs', 'package*.json', 'vite.config.ts', 'tsconfig.json', 'Dockerfile', 'docs/web-service.md', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:web
      - name: Package standalone service
        run: tar -czf ghostcursor-web.tar.gz -C dist service web
      - uses: actions/upload-artifact@v4
        with:
          name: GhostCursor-Web
          path: ghostcursor-web.tar.gz
          if-no-files-found: error
